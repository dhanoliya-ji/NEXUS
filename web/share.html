<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shared chat · NEXUS</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: block; }
    .share-head { max-width: 760px; margin: 0 auto; padding: 24px 16px 8px; display: flex; align-items: center; gap: 10px; }
    .share-head h1 { font: 400 26px var(--serif); margin: 0; flex: 1; }
    .share-head span { font-size: 13px; color: var(--muted); }
    #messages { overflow: visible; }
    .edit-msg, .meta button { display: none; }
  </style>
</head>
<body>
  <!-- A read-only page for ONE chat someone shared from NEXUS -->
  <div class="share-head"><img src="icon.svg" width="26" height="26" alt=""><h1 id="title">Loading…</h1><span>shared from NEXUS</span></div>
  <section id="messages"></section>

  <script src="render.js"></script>
  <script src="runners.js"></script>
  <script>
    // Same look as the main site: user bubbles + assistant answers (markdown, math, charts, code)
    function loadScript(url) {
      return new Promise((ok, fail) => { const s = document.createElement("script"); s.src = url; s.onload = ok; s.onerror = fail; document.head.appendChild(s); });
    }
    (async () => {
      const token = new URLSearchParams(location.search).get("t") || "";
      const res = await fetch("/api/shared?t=" + encodeURIComponent(token));
      const data = await res.json();
      if (!res.ok) { document.getElementById("title").textContent = data.error; return; }
      document.getElementById("title").textContent = data.title;
      document.title = data.title + " · NEXUS";
      for (const m of data.messages) {
        const div = document.createElement("div");
        div.className = "msg " + m.role;
        if (m.role === "user") {
          div.innerHTML = '<div class="bubble"></div>';
          div.querySelector(".bubble").textContent = m.content.replace(/\n*<<FILE: (.+?)>>\n[\s\S]*?\n<<END FILE>>/g, "\n📄 $1");
        } else {
          div.innerHTML = '<img class="avatar" src="icon.svg" alt=""><div class="body"><div class="content"></div><div class="meta"><span class="model"></span></div></div>';
          div.querySelector(".content").innerHTML = toHtml(m.content);
          div.querySelector(".model").textContent = m.model || "";
          div.querySelectorAll("pre code").forEach((b) => b.classList.contains("language-chart") ? renderChart(b) : b.classList.contains("language-mermaid") ? renderMermaid(b) : hljs.highlightElement(b));
        }
        document.getElementById("messages").appendChild(div);
      }
    })();
  </script>
</body>
</html>
