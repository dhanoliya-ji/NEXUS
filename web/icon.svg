<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- NEXUS mark: a center node connected to 6 outer nodes -->
  <g stroke="#cc785c" stroke-width="4" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="8"/>
    <line x1="32" y1="32" x2="52.8" y2="20"/>
    <line x1="32" y1="32" x2="52.8" y2="44"/>
    <line x1="32" y1="32" x2="32" y2="56"/>
    <line x1="32" y1="32" x2="11.2" y2="44"/>
    <line x1="32" y1="32" x2="11.2" y2="20"/>
  </g>
  <g fill="#cc785c">
    <circle cx="32" cy="32" r="8"/>
    <circle cx="32" cy="8" r="5"/><circle cx="52.8" cy="20" r="5"/><circle cx="52.8" cy="44" r="5"/>
    <circle cx="32" cy="56" r="5"/><circle cx="11.2" cy="44" r="5"/><circle cx="11.2" cy="20" r="5"/>
  </g>
</svg>
