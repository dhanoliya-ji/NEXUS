# ============================================================
#  Model scout — every Sunday: are NEXUS's models still alive? any new free ones?
# ============================================================
#  Runs scripts/scout-models.js with your provider keys (GitHub secrets).
#  Opens an issue only if a configured model really stopped working.
#  The full report (incl. new free models and providers) is in the run's Summary tab.

name: Model scout

on:
  schedule:
    - cron: "30 3 * * 0"      # Sunday 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every provider's model list
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          node scripts/scout-models.js
          cat scout-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open an issue if models disappeared
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat scout-broken.txt)" != "0" ]; then
            gh issue create --repo "${{ github.repository }}" \
              --title "🔭 Model scout: $(cat scout-broken.txt) model(s) no longer available" --body-file scout-report.md
          fi
